name: Lua syntax check
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.2 parser
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2
      - name: Compile-check every Lua file
        run: |
          set -e
          find . -type f -name '*.lua' -print0 | xargs -0 -r -n1 luac5.2 -p
      - name: Run recovery regression tests
        run: lua5.2 tests/recovery.lua

      - name: Test controller-side Lua worker
        run: lua5.2 tests/worker_sim.lua
      - name: Install Python test dependencies
        run: python -m pip install "pytest>=8" "pytest-asyncio>=0.24" "websockets>=14,<17"
      - name: Test persistent controller and WebSocket protocol
        run: python -m pytest -q tests/test_controller.py
      - name: Simulate integrated workshop birth
        run: lua5.2 tests/workshop_sim.lua
