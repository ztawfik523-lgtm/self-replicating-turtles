name: Lua syntax check
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lua 5.2 parser
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2
      - name: Compile-check every Lua file
        run: |
          set -e
          find . -type f -name '*.lua' -print0 | xargs -0 -r -n1 luac5.2 -p
      - name: Run recovery regression tests
        run: lua5.2 tests/recovery.lua

      - name: Test controller-side Lua worker
        run: lua5.2 tests/worker_sim.lua
      - name: Install Python test dependencies
        run: python -m pip install "pytest>=8" "pytest-asyncio>=0.24" "websockets>=14,<17"
      - name: Test persistent controller and WebSocket protocol
        run: python -m pytest -q tests/test_controller.py
      - name: Simulate M2 survival bootstrap in woodland mock
        run: lua5.2 tests/bootstrap_m2_sim.lua
      - name: Verify real charcoal furnace uses plank fuel
        run: lua5.2 tests/charcoal_fuel_sim.lua
      - name: Test M2 safe abort for missing trees and fuel
        run: lua5.2 tests/bootstrap_m2_safety.lua
      - name: Verify M2 furnace restart and inventory-commit safety
        run: lua5.2 tests/fuel_cycle_recovery_sim.lua
      - name: Verify runtime installers use the exact source revision
        run: python -m pytest -q tests/test_install_manifest.py
      - name: Verify actual crafting upgrade auto-equipment
        run: lua5.2 tests/factory_upgrade_sim.lua
      - name: Simulate integrated workshop birth
        run: lua5.2 tests/workshop_sim.lua
      - name: Verify child controller inheritance and legacy compatibility
        run: lua5.2 tests/clone_worker_sim.lua
      - name: Simulate chest bootstrap and complete birth from raw materials
        run: lua5.2 tests/bootstrap_chest_sim.lua
      - name: Simulate controller installer success, staging failure and rollback
        run: lua5.2 tests/controller_installer_sim.lua
